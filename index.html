.invlist,.ledger .recipes{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:#5a4128 transparent;border:0;padding-top:.4cqh}
.lgrow{width:100%;padding:.55cqh .8cqh;background:none;border:0;border-left:.35cqh solid transparent;color:var(--bone);text-align:left;font-size:2.15cqh;cursor:pointer}
.lgrow:hover{background:#c9a86a12}
.lgrow[aria-pressed="true"]{background:linear-gradient(90deg,#c9a86a2a,transparent);border-left-color:var(--gold)}
.lgrow .nm{font-family:var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lgrow .eqm{font-style:normal;color:var(--gold);font-size:.75em;margin-right:.8cqh}
.lgrow.eq .nm{color:#f3e3c0}
.lgrow.locked{opacity:.55}
.lgrow > span:nth-child(n+3){font-family:var(--display);color:#d4c8ae}
.lgico{width:4.6cqh;height:4.6cqh;object-fit:contain;filter:drop-shadow(0 .2cqh .3cqh #000)}
.lgico.skn{display:grid;place-items:center;font-family:var(--display);color:var(--gold);border:.15cqh solid #c9a86a55;border-radius:50%;width:3.8cqh;height:3.8cqh}
.lgrow.fine .nm{color:#9ad1ff} .lgrow.master .nm{color:#ffcf6a}
.lgempty{color:var(--ash);font-style:italic;padding:2cqh .8cqh}
.lgright{grid-row:2;grid-column:2;min-height:0;display:flex;flex-direction:column;align-items:center;padding:1.6cqh 3.6cqh 1cqh}
.lgshow{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2cqh}
.lgbig,.ledger .wprev{flex:1;min-height:0;width:100%;display:grid;place-items:center}
.lgimg,.ledger .wbig{max-width:62%;max-height:100%;height:auto;width:auto;object-fit:contain;filter:drop-shadow(0 1.6cqh 2.4cqh #000)}
.ledger .wprev .wbig{height:min(40cqh,100%);width:auto}
.lgbig.weapon .lgimg{max-height:min(44cqh,100%)}
.lgbig .lgimg{height:min(36cqh,100%);width:auto}
.lgbox{position:relative;width:min(86cqh,100%);padding:2.2cqh 3.4cqh 2.4cqh;background:#0d0a08e6;border:.15cqh solid #c9a86a66;text-align:center;box-shadow:0 1cqh 3cqh #000c}
.lgc{position:absolute;width:2cqh;height:2cqh;border:.3cqh solid var(--gold);opacity:.8}
.lgc.tl{left:-.5cqh;top:-.5cqh;border-right:0;border-bottom:0}.lgc.tr{right:-.5cqh;top:-.5cqh;border-left:0;border-bottom:0}
.lgc.bl{left:-.5cqh;bottom:-.5cqh;border-right:0;border-top:0}.lgc.br{right:-.5cqh;bottom:-.5cqh;border-left:0;border-top:0}
.lgbox h3{margin:0 0 1.2cqh;padding-bottom:1cqh;border-bottom:.15cqh solid #c9a86a40;font:400 3.6cqh var(--display);letter-spacing:.02em;text-transform:none}
.lgbox h3 small{font-family:var(--fellsc);font-size:1.4cqh;letter-spacing:.14em;color:var(--gold);vertical-align:middle;text-transform:uppercase;margin-left:1cqh}
.lgbox h3.rare{color:#c9a6ff} .lgbox h3.fine{color:#9ad1ff} .lgbox h3.master{color:#ffcf6a}
.lgstats{display:flex;justify-content:center;gap:4cqh;margin-bottom:1.2cqh}
.lgstats span{display:flex;align-items:baseline;gap:1cqh}
.lgstats small{font-family:var(--fellsc);font-size:1.45cqh;letter-spacing:.14em;text-transform:uppercase;color:#a99c80}
.lgstats b{font:400 3.4cqh var(--display);color:var(--bone)}
.lgdesc{font-size:1.95cqh;color:#cbbfa6;line-height:1.4}
.lgdesc .short,.lgmats .short{color:#e98a8f} .lgdesc .rare{color:#c9a6ff}
.lgmats{margin-top:1cqh;font-size:1.8cqh;color:#a99c80} .lgmats small{color:#7d7360}
.lglog{margin-top:.6cqh;font-size:1.8cqh;color:#d9b36a;min-height:2.4cqh}
.lgacts{display:flex;justify-content:center;gap:1.4cqh;margin-top:1.6cqh;flex-wrap:wrap}
.lgbtn{font:400 2.1cqh var(--fellsc);letter-spacing:.12em;text-transform:uppercase;padding:1cqh 3cqh;min-width:18cqh;background:#1d1612;color:var(--bone);border:.18cqh solid #c9a86a99;border-radius:.3cqh;cursor:pointer;transition:background .12s,box-shadow .12s,border-color .12s}
.lgbtn:hover:not(:disabled){background:#2c221a;border-color:var(--gold);box-shadow:0 0 1.4cqh #f1c75b33}
.lgbtn:disabled{opacity:.45;cursor:default}
.lgbtn.rare{border-color:#a98ad8} .lgbtn.rare:hover:not(:disabled){border-color:#c9a6ff;box-shadow:0 0 1.4cqh #a98ad855}
.lgbtn.sm{font-size:1.5cqh;padding:.6cqh 1.6cqh;min-width:0;margin-right:2cqh}
.lgfoot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;padding:1.2cqh 3.6cqh 1.6cqh;border-top:.15cqh solid #c9a86a40;background:linear-gradient(transparent,#000c);font-size:1.75cqh;color:#a99c80}
.lgfoot b{color:var(--bone);font-weight:400;font-family:var(--display);font-size:1.15em}
.lgfoot kbd{font:inherit;font-family:var(--fellsc);font-size:1.35cqh;letter-spacing:.08em;color:var(--bone);border:.15cqh solid #c9a86a66;border-radius:.4cqh;padding:.1cqh .7cqh;margin:0 .6cqh 0 1.6cqh}
.lgfoot kbd:first-child{margin-left:0}
/* crafting list rows reuse .recipe */
.ledger .recipe{display:grid;grid-template-columns:4.6cqh 1fr 5cqh 27cqh;gap:1.2cqh;align-items:center;padding:.55cqh .8cqh;border:0;border-left:.35cqh solid transparent;border-bottom:0;font-size:2.1cqh}
.ledger .recipe .wthumb{width:4.6cqh;height:4.6cqh;grid-row:auto}
.ledger .recipe strong{font-family:var(--display);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;grid-column:auto}
.ledger .recipe .lv{text-align:right;color:#d4c8ae;font-family:var(--display)}
.ledger .recipe .req{grid-column:auto;text-align:right;font-size:1.6cqh;color:#a99c80;line-height:1.25}
.ledger .recipe[aria-pressed="true"]{background:linear-gradient(90deg,#c9a86a2a,transparent);box-shadow:none;border-left-color:var(--gold)}
.ledger .recipe.hasw{grid-template-columns:4.6cqh 1fr 5cqh 27cqh}
.ledger .recipe.hasw .req{grid-column:auto}
.ledger .lghead{grid-template-columns:4.6cqh 1fr 5cqh 27cqh}
.ledger .foldh{font-size:1.7cqh;letter-spacing:.16em;text-transform:uppercase;padding:1.1cqh .4cqh .6cqh;color:#c9a86a}
.ledger .foldh small{font-size:1.5cqh}
.ledger .fold{border-bottom:.15cqh solid #c9a86a1a}
.ledger .wprev[hidden]{display:grid}
/* inventory: the panel becomes the whole screen */
#panel:has(.ledger.inv:not([hidden])){left:0;top:0;width:100%;height:100%;padding:0;background:none;clip-path:none;box-shadow:none;overflow:visible;display:block}
#panel:has(.ledger.inv:not([hidden]))::after,#panel .lghide{display:none}
#panel section.ledger{display:grid;overflow:hidden;gap:0;padding:0;min-height:0;height:100%}
#panel .ledger .lgbox h3,.ledger .lgbox h3{color:var(--bone);font-family:var(--display);font-size:3.2cqh;letter-spacing:.08em;border-bottom:.15cqh solid #c9a86a40}
#panel .ledger .lgbox h3.fine{color:#9ad1ff} #panel .ledger .lgbox h3.master{color:#ffcf6a} .ledger .lgbox h3.rare{color:#c9a6ff}
.lgchar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:2cqh;padding-bottom:1.2cqh;border-bottom:.15cqh solid #c9a86a26}
.lgchar .cstat{flex:1;display:flex;align-items:center;gap:2.4cqh;margin:0;border:0;padding:0}
.lgchar .chp{flex:1;max-width:30cqh}
.lgchar .cgear{display:flex;gap:1cqh;margin:0;padding:0;border:0}
.lgchar .gslot.sm{width:7cqh}
.ring.big{display:grid;place-items:center} .ring.big svg{width:24cqh;height:24cqh;grid-area:1/1} .ring.big b{grid-area:1/1;position:relative;z-index:1;top:auto;transform:none;font:400 8cqh var(--display);color:var(--bone)}
body.drawer-open .brand,body.drawer-open .navback,body.chopen .brand,body.chopen .navback,body.chopen #townSpots,body.chopen #townGlows{opacity:0;pointer-events:none}
.ledger .recipe.locked .lv{color:#e98a8f}
body.drawer-open #cHint,body.drawer-open #cTabs .stag{opacity:0}

/* ===== v50: inn, inventory doll, craft notice ===== */
.lgsplit{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:1fr 34%;gap:2.4cqh;padding-top:1.4cqh}
.lgdollp{min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;border-left:.15cqh solid #c9a86a26;padding-left:2cqh}
.lgdollp{overflow:hidden}
.lgdollp .doll{height:auto;width:150%;margin:0 -25% -2cqh;max-height:none;aspect-ratio:1100/1500;filter:drop-shadow(0 1.4cqh 2cqh #000)}
.lgdollcap{text-align:center;margin-top:.6cqh}.lgdollcap b{display:block;font:400 2.3cqh var(--display);color:var(--bone)}.lgdollcap span{font-size:1.5cqh;color:#a99c80}
.ledger.inv .lgbox{width:100%}
.craftnote{position:absolute;left:72%;top:11%;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:2cqh;padding:1.6cqh 3.4cqh 1.6cqh 1.8cqh;background:linear-gradient(#1d1612f8,#0d0a08fa);border:.2cqh solid #c9a86a99;box-shadow:0 1cqh 3cqh #000,0 0 3cqh #f1c75b22;animation:cnIn .35s cubic-bezier(.2,1.4,.4,1)}
.craftnote.eq{border-color:var(--gold);box-shadow:0 1cqh 3cqh #000,0 0 4cqh #f1c75b55}
.craftnote .cnimg{width:8cqh;height:8cqh;object-fit:contain;filter:drop-shadow(0 .4cqh .6cqh #000)}
.craftnote small{display:block;font-family:var(--fellsc);font-size:1.5cqh;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.craftnote b{display:block;font:400 3cqh var(--display);color:var(--bone)}
.craftnote span{display:block;font-size:1.8cqh;color:#cbbfa6}
.craftnote.eq span{color:#f1d58a}
.craftnote.out{transition:opacity .45s,transform .45s;opacity:0;transform:translateX(-50%) translateY(-2cqh)}
@keyframes cnIn{from{opacity:0;transform:translateX(-50%) scale(.85)}to{opacity:1;transform:translateX(-50%) scale(1)}}
.lgbtn.done{animation:btnDone .6s ease-out}
@keyframes btnDone{0%{box-shadow:0 0 0 0 #f1c75baa;border-color:var(--gold)}100%{box-shadow:0 0 0 2.4cqh #f1c75b00}}
#v-inn .spots{position:absolute;inset:0}
.innlog{position:absolute;left:50%;top:4%;transform:translateX(-50%);font-family:var(--fell);font-style:italic;font-size:2.4cqh;color:var(--bone);text-shadow:0 .2cqh .6cqh #000;white-space:nowrap;pointer-events:none}

/* ===== v52: inn stations, each with its own cue (not the town glows) ===== */
.innspot{position:absolute;background:none;border:0;padding:0;cursor:pointer;color:var(--bone)}
.innlbl{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font:400 3.2cqh var(--display);text-shadow:0 .2cqh .6cqh #000,0 0 1.6cqh #000c;transition:transform .2s,color .2s;pointer-events:none}
.innlbl b{font:italic 400 2cqh var(--fell);color:var(--gold);margin-left:.6cqh}
.innspot:hover .innlbl,.innspot:focus-visible .innlbl{transform:translate(-50%,-50%) scale(1.08);color:#fff3d6}
.innspot:focus-visible{outline:none}
/* rest: sleepy Zzz drifting up off the pillow */
.zzz{position:absolute;left:76%;top:8%;pointer-events:none}
.zzz i{position:absolute;font:italic 400 3.4cqh var(--display);color:#cfe0ff;text-shadow:0 0 1.2cqh #9fb8ff88,0 .2cqh .4cqh #000;opacity:0;animation:zz 3.6s ease-out infinite}
.zzz i:nth-child(2){font-size:2.7cqh;animation-delay:1.2s}.zzz i:nth-child(3){font-size:2.1cqh;animation-delay:2.4s}
@keyframes zz{0%{opacity:0;transform:translate(0,0) rotate(-8deg)}15%{opacity:.9}100%{opacity:0;transform:translate(5cqh,-11cqh) rotate(10deg)}}
.innspot.rest:hover .zzz i{animation-duration:2.2s}
/* plan: a gold ink line tracing the map's edge */
.mapline{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.mapline polygon{fill:#f1c75b10;stroke:var(--gold);stroke-width:.5;vector-effect:non-scaling-stroke;stroke-width:2.2px;stroke-dasharray:10 7;stroke-linejoin:round;opacity:.65;filter:drop-shadow(0 0 4px #f1c75b);animation:march 1.6s linear infinite}
.innspot.plan:hover .mapline polygon{opacity:1;fill:#f1c75b22}
@keyframes march{to{stroke-dashoffset:-34}}
/* gear: firelit dust drifting around the stand and chest */
.motes{position:absolute;inset:0;pointer-events:none}
.motes i{position:absolute;width:.5cqh;height:.5cqh;border-radius:50%;background:#ffd28a;box-shadow:0 0 .9cqh .2cqh #ffb35c;opacity:0;animation:mote 4s ease-in-out infinite}
@keyframes mote{0%{opacity:0;transform:translate(0,0)}20%{opacity:.85}100%{opacity:0;transform:translate(1.5cqh,-9cqh)}}
.innspot.plan:hover .motes i,.innspot.gear:hover .motes i{animation-duration:2.4s!important}

/* v52: no title/breadcrumb in game; back seal takes the corner */
.brand{display:none!important}
.navback{top:4%!important}

/* ===== v54: character strip — no health bar, helm as a round toggle, slots double-click ===== */
.cgearw{display:flex;flex-direction:column;align-items:flex-end;gap:1.6cqh}
.lgchar .gslot.off{opacity:.6;cursor:pointer} .lgchar .gslot.off:hover{opacity:.9}
.helmico{width:5.4cqh;height:5.4cqh;padding:0;border:0;background:none;cursor:pointer;color:var(--bone);margin-right:.8cqh;transition:transform .15s,color .2s}
.helmico svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 .2cqh .3cqh #000)}
.helmico .ring{fill:none;stroke:currentColor;stroke-width:5}
.helmico .hm{fill:currentColor}
.helmico .cut{fill:none;stroke:#120d0a;stroke-width:2.2;stroke-linecap:round}
.helmico .holes{fill:#120d0a}
.helmico .slash{fill:none;stroke:currentColor;stroke-width:5;opacity:0;transition:opacity .2s}
.helmico.off{color:#8a8178} .helmico.off .slash{opacity:1}
.helmico:hover:not(:disabled){transform:scale(1.08);color:#fff3d6} .helmico.off:hover:not(:disabled){color:#b3a99e}
.helmico:disabled{opacity:.35;cursor:default}
.lgchar{align-items:flex-start}
.lgchar .cstat{align-self:center}

/* v54: bag on the dock, naming at the pick, doll centred, helm toggle sizing */
.sbag{flex:none;width:6cqh;height:6cqh;padding:0;border:0;background:none;cursor:pointer;opacity:.92;transition:transform .2s,opacity .15s,filter .2s}
.sbag img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 .3cqh .4cqh #000c)}
.sbag:hover,.sbag:focus-visible,.sbag.on{opacity:1;transform:translateY(-.4cqh) rotate(-6deg);filter:drop-shadow(0 0 1cqh #f1c75b66)} .sbag:focus-visible{outline:none}
.fpname{display:flex;flex-direction:column;gap:.8cqh}
.fpname small{font-family:var(--fellsc);font-size:1.9cqh;letter-spacing:.1em;color:var(--ash)}
.fpname input{font:400 4.4cqh var(--display);color:var(--bone);background:#0e0a08cc;border:0;border-bottom:.2cqh solid #c9a86a66;padding:.6cqh .4cqh;width:100%;outline:none;caret-color:var(--gold)}
.fpname input:focus{border-bottom-color:var(--gold)} .fpname input::placeholder{color:#6d6257}
.lgdollp .doll{transform:translateX(-5.7%)}
.helmico{width:6.2cqh;height:6.2cqh;margin-right:.4cqh} .cgearw{gap:3cqh}

/* v55: doll panel — figure and copy centred, stats under the name, helm toggle tucked top-right */
.lgdollp{position:relative;padding:0 1.6cqh;align-items:center;justify-content:center!important}
.lgdollp .doll{margin-top:-64%!important;margin-bottom:-4%!important} /* trim the empty headroom baked into the 1100x1500 stage so the figure itself centres */
.lgdollp .doll{transform:translateX(-3.3%)}
.lgdollcap{width:100%;text-align:center}
.lgdollcap span{display:block}
.lgdollcap em{display:block;font-style:normal;font-size:1.6cqh;color:#a99c80;position:absolute;left:0;right:0;bottom:1.4cqh;text-align:center}
.lgdollcap{margin-top:2.2cqh!important}
.lgdollcap em i{font-style:normal;font-family:var(--display);color:var(--bone);font-size:1.2em}
.lgdollp .helmico{position:absolute;top:1.4cqh;right:1.4cqh;width:4cqh;height:4cqh;margin:0;z-index:2}
.cgearw{gap:0}

/* v60: character strip numbers each get their own label */
.lgchar .ccb{display:flex;align-items:stretch;gap:0;font-size:inherit}
.lgchar .ccb span{display:flex;flex-direction:column;align-items:center;gap:.2cqh;padding:0 2.2cqh;border-left:.15cqh solid #c9a86a33}
.lgchar .ccb span:first-child{padding-left:0;border-left:0;align-items:flex-start}
.lgchar .ccb small{font-family:var(--fellsc);font-size:1.4cqh;letter-spacing:.14em;text-transform:uppercase;color:#a99c80}
.lgchar .ccb b{font:400 3.2cqh var(--display);color:var(--bone);line-height:1}

/* v61: footer hints are buttons that do what they say */
.lgkeys{display:flex;gap:2.4cqh}
.lgkey{background:none;border:0;padding:.4cqh .6cqh;margin:0 -.6cqh;font:inherit;color:inherit;cursor:pointer;border-radius:.4cqh;transition:color .15s,background .15s}
.lgkey kbd{margin-left:0!important}
.lgkey:hover,.lgkey:focus-visible{color:var(--bone);background:#c9a86a1a;outline:none} .lgkey:hover kbd{border-color:var(--gold)}

/* ===== v62: combat — gothic cross menu around the silver star, iron-and-silver plates, splats by the heads ===== */
:root{--silver:#b9b4ab;--silver-hi:#e6e2da;--silver-lo:#5f5a54;--iron:#16120f;--iron-hi:#2a2420}
body.fighting #foe{cursor:default!important;animation:breatheE 3.2s ease-in-out infinite!important}
body.fighting #foe:hover{filter:none}
#fHint{display:none!important}
#fLog{top:auto!important;bottom:1.6%!important;width:40%!important;font-size:2.5cqh!important;z-index:7}
#fLog em{font-size:1.1em}
.who .sub,.who .streak{display:none}
/* the cross */
.fcross{position:absolute;left:50%;top:75%;width:0;height:0;z-index:8}
.fstar{position:absolute;left:0;top:0;height:21cqh;transform:translate(-50%,-50%);filter:drop-shadow(0 0 1.2cqh #000) drop-shadow(0 0 2.4cqh #cfd6e855);pointer-events:none;transition:filter .3s,transform .3s}
.fcross:has(.fbtn:hover:not(:disabled)) .fstar{filter:drop-shadow(0 0 1.2cqh #000) drop-shadow(0 0 3.4cqh #dfe6f6aa);transform:translate(-50%,-50%) scale(1.06)}
.fbtn{position:absolute;display:grid;place-items:center;padding:0;cursor:pointer;color:#e9e3d6;font:400 3cqh var(--display);letter-spacing:.03em;text-shadow:0 .2cqh .4cqh #000;
  background:linear-gradient(180deg,#2b2521 0%,#17120f 55%,#0d0a08 100%);border:0;isolation:isolate;
  clip-path:polygon(1.6cqh 0,calc(100% - 1.6cqh) 0,100% 50%,calc(100% - 1.6cqh) 100%,1.6cqh 100%,0 50%);transition:transform .15s,color .15s}
.fbtn::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,var(--silver-hi),var(--silver-lo) 45%,#8e887f 60%,#3a3632);
  clip-path:polygon(1.6cqh 0,calc(100% - 1.6cqh) 0,100% 50%,calc(100% - 1.6cqh) 100%,1.6cqh 100%,0 50%,1.6cqh 0,1.75cqh .28cqh,.32cqh 50%,1.75cqh calc(100% - .28cqh),calc(100% - 1.75cqh) calc(100% - .28cqh),calc(100% - .32cqh) 50%,calc(100% - 1.75cqh) .28cqh,1.75cqh .28cqh)}
.fbtn::after{content:"";position:absolute;inset:.75cqh 2.2cqh;border-top:.12cqh solid #ffffff14;border-bottom:.12cqh solid #00000080;pointer-events:none}
.fbtn span{position:relative;z-index:1}
.fbtn.top{left:-12cqh;top:-13.4cqh;width:24cqh;height:6.6cqh;font-size:3.8cqh}

/* ===== v72: region card — three clear actions in iron and silver ===== */
.mapcard{width:min(40%,62cqh)!important;padding:2.4cqh 2.6cqh 1.6cqh!important;background:linear-gradient(180deg,#1b1613f7,#0c0908fa)!important;border:.2cqh solid var(--silver-lo);outline:.12cqh solid #000;
  box-shadow:0 1.6cqh 3.6cqh #000d,inset 0 0 0 .5cqh #0c0908,inset 0 0 0 .62cqh #8e887f55!important;clip-path:none!important;filter:none!important}
.mapcard::before{display:none!important}
.mapcard .mcx{position:absolute;top:1.4cqh;right:1.6cqh;background:none;border:0;color:#a99c80;font-size:2.4cqh;cursor:pointer} .mapcard .mcx:hover{color:#fff}
.mchead{padding-bottom:1.2cqh;margin-bottom:.6cqh;border-bottom:.14cqh solid #8e887f55}
.mchead h3{margin:0;font:400 4.4cqh var(--display);line-height:1.05}
.mcsub{font:400 1.7cqh var(--fellsc);letter-spacing:.14em;text-transform:uppercase;color:var(--silver);margin-top:.4cqh}
.mcchips{display:flex;gap:.8cqh;margin-top:.9cqh;flex-wrap:wrap}
.mcchips span{font:400 1.5cqh var(--fellsc);letter-spacing:.12em;text-transform:uppercase;padding:.3cqh 1cqh;border:.14cqh solid #8e887f66;color:#cbbfa6}
.mcchips .here{color:var(--gold);border-color:#f1c75b77} .mcchips .lock{color:#e98a8f;border-color:#e98a8f66}
.mcseal{margin:1cqh 0 .4cqh;font-style:italic;color:#e98a8f;font-size:2.1cqh}
.mcsec{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:1.6cqh;padding:1.3cqh 0;border-bottom:.12cqh solid #8e887f2e}
.mcsec:last-child{border-bottom:0}
.mcsec.off{opacity:.45}
.mcpics{display:flex;gap:.4cqh;width:12cqh;justify-content:center}
.mcfoe{width:6cqh;height:6cqh;object-fit:cover;object-position:50% 12%;border-radius:50%;background:#0b0807;box-shadow:0 0 0 .2cqh #0c0908,0 0 0 .38cqh var(--silver-lo)}
.mcpics:has(.mcfoe:only-child) .mcfoe{width:7cqh;height:7cqh}
.mcmat{width:3.8cqh;height:3.8cqh;object-fit:contain;filter:drop-shadow(0 .2cqh .3cqh #000)}
.mctxt{min-width:0}
.mclbl{font:400 1.5cqh var(--fellsc);letter-spacing:.2em;text-transform:uppercase;color:#a99c80}
.mctxt p{margin:.1cqh 0 .2cqh;font-size:2.1cqh;color:var(--bone)} .mctxt p.bn{font:400 2.8cqh var(--display);color:#ff9a9e}
.mctxt small{display:block;font-size:1.6cqh;font-style:italic;color:#a99c80;line-height:1.3}
.mcprog{display:block;height:.8cqh;margin-top:.7cqh;background:#0b0908;box-shadow:0 0 0 .14cqh #0d0a08,0 0 0 .28cqh var(--silver-lo);overflow:hidden}
.mcprog u{display:block;height:100%;transform-origin:left;background:linear-gradient(#c8323a,#7d1418)}
.mcbtn{position:relative!important;left:auto!important;top:auto!important;width:16cqh;height:5.4cqh;--cap:3.4cqh;font-size:2.3cqh}
.mcbtn.main{color:#fff}
.mcbtn.boss:not(:disabled){color:#ffcfcf} .mcbtn.boss:hover:not(:disabled){text-shadow:0 0 1.2cqh #c8323a,0 .2cqh .4cqh #000}
.mcsec.boss.ready .mcfoe{box-shadow:0 0 0 .2cqh #0c0908,0 0 0 .38cqh #c8323a,0 0 1.4cqh #c8323a88}

/* v72: encounter preview in the same iron and silver */
.enc{background:linear-gradient(180deg,#1b1613f7,#0c0908fa)!important;border:.22cqh solid var(--silver-lo)!important;outline:.14cqh solid #000;border-radius:0!important;
  box-shadow:0 2cqh 5cqh #000e,inset 0 0 0 .6cqh #0c0908,inset 0 0 0 .75cqh #8e887f55,inset 0 0 6cqh #000a!important;clip-path:none!important;filter:none!important}
.enc::before,.enc::after{display:none!important}
.enc #encKicker{font:400 1.7cqh var(--fellsc);letter-spacing:.2em;text-transform:uppercase;color:var(--silver)}
.enc dl{border-color:#8e887f44!important} .enc dt{font:400 1.6cqh var(--fellsc)!important;letter-spacing:.16em!important;text-transform:uppercase;color:#a99c80!important;align-self:center}
.encacts{display:flex!important;justify-content:flex-end;align-items:center;gap:2cqh}
.encacts .fbtn{position:relative;left:auto;top:auto;width:20cqh;height:6cqh;--cap:3.8cqh;font-size:2.6cqh}
.encacts .fbtn.main{width:24cqh;height:7cqh;--cap:4.3cqh;font-size:3.2cqh}
.encacts .fbtn.main:hover{text-shadow:0 0 1.4cqh #c8323a,0 .2cqh .4cqh #000}

/* v73: region card sits centre screen; arrows step between regions */
#mapCard.mapcard{left:50%!important;right:auto!important;top:47%!important;transform:translate(-50%,-50%);animation:mcin .22s ease-out!important;z-index:12}
#mapCard.mapcard::after{display:none!important}
@keyframes mcin{from{opacity:0;transform:translate(-50%,-48%)}}
.mcarrow{position:absolute;top:50%;width:7cqh;height:7cqh;margin-top:-3.5cqh;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  font:400 5cqh/1 var(--display);color:var(--silver-hi);padding:0 0 .6cqh;background:radial-gradient(circle at 50% 40%,#2b241f,#0c0908 75%);
  border:0;box-shadow:0 0 0 .3cqh #0c0908,0 0 0 .55cqh var(--silver-lo),0 .8cqh 1.6cqh #000c;transition:transform .15s,color .15s,box-shadow .15s}
.mcarrow.prev{left:-10cqh} .mcarrow.next{right:-10cqh}
.mcarrow:hover,.mcarrow:focus-visible{color:#fff;outline:none;transform:scale(1.08);box-shadow:0 0 0 .3cqh #0c0908,0 0 0 .55cqh var(--silver-hi),0 0 1.6cqh #dfe6f666,0 .8cqh 1.6cqh #000c}
.mcdots{display:flex;justify-content:center;gap:1cqh;margin-top:1.4cqh}
.mcdots i{width:.9cqh;height:.9cqh;border-radius:50%;background:#5f5a54} .mcdots i.on{background:var(--silver-hi);box-shadow:0 0 .8cqh #dfe6f6aa}
.mcsec.town{grid-template-columns:1fr auto}
.mcsec.town .mctxt p{margin-bottom:.8cqh}

/* v74: back button lives in the dock beside the portrait */
.dock .navback{position:static!important;top:auto!important;bottom:auto!important;left:auto!important;font-size:2.2cqh;gap:.9cqh}
.dock .navback .nbs{width:4.6cqh;height:4.6cqh}
.dock .navback small{font-size:1.3cqh}
.dock .navback[hidden],.dock .navback[hidden]+.nbsep{display:none}
</style>

<script>
(() => {
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = ms => new Promise(r => setTimeout(r, ms));
const ART = 'art/final/';

/* ================= SOUND + MUSIC (all synthesized with Web Audio, no files) ================= */
const SND = (() => {
  const LS = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
  const SS = (k, v) => { try { localStorage.setItem(k, v); } catch(e){} };
  let sfxOn = LS('oathless-sfx') !== 'off', musOn = LS('oathless-music') !== 'off';
  let AC = null, MASTER = null, NOISE = null, MBUS = null, MOUT = null, COMBAT = false;
  const sfxGain = () => .5 * (COMBAT ? .75 : 1), musGain = () => .16;
  function audio(){
    if (!sfxOn && !musOn) return null;
    if (!AC){ const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
      try { AC = new C(); } catch(e){ return null; }
      MASTER = AC.createDynamicsCompressor(); MASTER.threshold.value = -14; MASTER.ratio.value = 4;
      const out = AC.createGain(); out.gain.value = sfxGain(); MASTER.connect(out); out.connect(AC.destination); MASTER._out = out;
      const len = AC.sampleRate; NOISE = AC.createBuffer(1, len, len); const d = NOISE.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      AC.onstatechange = () => { if (AC.state === 'running') sync(); };
    }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  }
  const unlock = () => { const a = audio(); if (a) (a.state === 'running' ? Promise.resolve() : a.resume()).then(sync).catch(() => {}); };
  for (const ev of ['pointerdown','touchend','keydown']) addEventListener(ev, unlock, { passive:true, capture:true });
  document.addEventListener('visibilitychange', () => { if (!AC) return; if (document.hidden) AC.suspend(); else AC.resume().then(sync); });

  /* ---- effect voices ---- */
  function envl(g, t, a, peak, d){ g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + d); }
  function tone(type, f0, f1, dur, vol, at = 0){ const t = AC.currentTime + at, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    envl(g, t, .005, vol, dur); o.connect(g); g.connect(MASTER); o.start(t); o.stop(t + dur + .06); }
  function noise(dur, vol, ft, f0, f1, q = 1, at = 0, att = .004){ const t = AC.currentTime + at, n = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    n.buffer = NOISE; n.loop = true; f.type = ft; f.Q.value = q; f.frequency.setValueAtTime(f0, t); if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + att + dur);
    envl(g, t, att, vol, dur); n.connect(f); f.connect(g); g.connect(MASTER); n.start(t, Math.random() * .5); n.stop(t + att + dur + .06); }
  function steel(base, dur, vol, at = 0){ [1, 1.37, 1.79, 2.41].forEach((m, i) => tone('sine', base * m, base * m * .998, dur * (1 - i * .15), vol / (1 + i * .8), at)); }
  const J = () => .92 + Math.random() * .16;
  const FX = {
    click(){ tone('triangle', 420 * J(), 300, .045, .07); noise(.025, .04, 'highpass', 3000, 0, .7); },
    seal(){ tone('sine', 180, 90, .12, .35); noise(.06, .16, 'lowpass', 900, 200, .8); },          // pressing a wax seal
    page(){ noise(.16, .14, 'bandpass', 1400 * J(), 3800, .9, 0, .04); noise(.12, .1, 'bandpass', 3200, 900, .8, .08); },
    swing_sword(){ noise(.15, .34, 'bandpass', 700, 3400, 1.3); steel(2100, .08, .02, .1); },
    swing_great(){ noise(.3, .4, 'bandpass', 260, 1400, 1.1, 0, .05); },
    swing_mace(){ noise(.22, .36, 'bandpass', 330, 1500, 1.2, 0, .03); },
    hit_sword(){ noise(.06, .45, 'highpass', 2600, 0, .7); steel(1650, .3, .06, .005); tone('sine', 150, 55, .15, .55); },
    hit_great(){ tone('sine', 110, 38, .3, .8); noise(.2, .5, 'lowpass', 1800, 200, .7); steel(900, .4, .05, .01); },
    hit_mace(){ tone('sine', 95, 40, .25, .85); noise(.12, .55, 'lowpass', 1200, 180, .8); noise(.05, .25, 'bandpass', 2400, 0, 3, .01); },
    crit(){ tone('triangle', 1980, 1900, .26, .09, .02); steel(2600, .5, .05, .02); },
    block(){ steel(780 * J(), .5, .1); noise(.06, .3, 'bandpass', 3000, 0, 2); tone('sine', 130, 60, .1, .4); },
    parry(){ steel(1250, .9, .12); steel(1870, .7, .07, .04); noise(.05, .3, 'highpass', 4000, 0, .7); },
    hurt(){ tone('sine', 110, 38, .22, .8); noise(.14, .5, 'lowpass', 1400, 250, .8); },
    foe_wind(){ noise(.5, .18, 'bandpass', 220, 600, 1.4, 0, .25); tone('sawtooth', 70, 55, .5, .05); },
    win(){ [294, 349, 440].forEach((f, i) => tone('triangle', f, f, .25, .12, i * .1)); tone('triangle', 587, 587, .7, .13, .3); },
    lose(){ [440, 392, 349, 294].forEach((f, i) => tone('triangle', f, f * .99, .35, .11, i * .18)); noise(.8, .15, 'lowpass', 600, 120, .7, .2); },
    level(){ [294, 370, 440, 587, 740].forEach((f, i) => tone('square', f, f, .15, .035, i * .07)); tone('triangle', 587, 587, .8, .12, .35); },
    mine(){ steel(1900 * J(), .25, .05); noise(.05, .35, 'bandpass', 2200, 0, 2.5); tone('sine', 200, 90, .08, .25); },
    forage(){ noise(.22, .2, 'bandpass', 2600 * J(), 1200, 1.2, 0, .03); noise(.1, .12, 'highpass', 5000, 0, .7, .12); },
    loose(){ tone('triangle', 260, 180, .12, .2); noise(.18, .22, 'bandpass', 2400, 900, 2, .01); },   // arrow loosed
    thud(){ tone('sine', 140, 60, .14, .55); noise(.08, .35, 'lowpass', 900, 200, .8); },
    escape(){ noise(.35, .15, 'bandpass', 1800, 600, 1, 0, .08); },
    anvil(){ steel(1320 * J(), .8, .11); steel(1980, .5, .05, .01); noise(.04, .4, 'highpass', 3500, 0, .7); tone('sine', 120, 70, .12, .4); },
    brew(){ for (let i = 0; i < 6; i++) tone('sine', 220 + Math.random() * 380, 500 + Math.random() * 500, .06, .1, i * .07 + Math.random() * .03); },
    sizzle(){ noise(.7, .2, 'highpass', 4500, 6500, .7, 0, .05); for (let i = 0; i < 5; i++) noise(.02, .12, 'bandpass', 3000 + Math.random() * 3000, 0, 4, .05 + i * .1); },
    pickup(){ tone('triangle', 660, 660, .08, .08); tone('triangle', 990, 990, .14, .07, .06); },
  };
  function sfx(name){ if (!sfxOn) return; try { if (audio() && FX[name]) FX[name](); } catch(e){} }

  /* ---- music: bars are scheduled a little ahead and crossfaded between screens ---- */
  const NOTE = n => { const m = /^([A-G])(#|b)?(-?\d)$/.exec(n); const k = { C:-9, D:-7, E:-5, F:-4, G:-2, A:0, B:2 }[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (+m[3] - 4) * 12; return 440 * Math.pow(2, k / 12); };
  const CH = { Am:['A2','C3','E3'], Dm:['D3','F3','A3'], Em:['E2','G2','B2'], Cm:['C3','Eb3','G3'], Gm:['G2','Bb2','D3'], Fm:['F2','Ab2','C3'], F:['F2','A2','C3'], C:['C3','E3','G3'], G:['G2','B2','D3'], E:['E2','G#2','B2'], A:['A2','C#3','E3'], Bb:['Bb2','D3','F3'], Ab:['Ab2','C3','Eb3'], Eb:['Eb3','G3','Bb3'], D:['D3','F#3','A3'] };
  const parse = s => s.split(' ').map(x => { const [n, d] = x.split(':'); return [n, +d]; });
  function bus(a){
    if (MBUS && MBUS.context === a) return MBUS;
    const dry = a.createGain(), out = a.createGain(), wet = a.createGain(), cv = a.createConvolver(), len = Math.floor(a.sampleRate * 3), ir = a.createBuffer(2, len, a.sampleRate);
    for (let c = 0; c < 2; c++){ const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    cv.buffer = ir; out.gain.value = musOn ? musGain() : 0; wet.gain.value = .4; MOUT = out;
    dry.connect(out); dry.connect(cv); cv.connect(wet); wet.connect(out); out.connect(a.destination); MBUS = dry; return dry;
  }
  function mEnv(g, t, att, peak, dur, rel){ g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + att); g.gain.setTargetAtTime(0, t + att + dur, rel); }
  function harp(a, d, f, t, v){ const g = a.createGain(), o = a.createOscillator(), o2 = a.createOscillator(), lp = a.createBiquadFilter(), g2 = a.createGain();
    o.type = 'triangle'; o2.type = 'sine'; o.frequency.value = f; o2.frequency.value = f * 2; lp.type = 'lowpass'; lp.frequency.value = 2200; g2.gain.value = .22;
    o.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(g); g.connect(d); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .006); g.gain.setTargetAtTime(0, t + .01, .6);
    o.start(t); o2.start(t); o.stop(t + 3); o2.stop(t + 3); }
  function pad(a, d, fs, t, dur, v, cut = 600){ fs.forEach(f => [-8, 8].forEach(c => { const o = a.createOscillator(), g = a.createGain(), lp = a.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = f * Math.pow(2, c / 1200); lp.type = 'lowpass'; lp.frequency.value = cut; lp.Q.value = .7;
    mEnv(g, t, dur * .35, v / fs.length, dur * .5, dur * .25); o.connect(lp); lp.connect(g); g.connect(d); o.start(t); o.stop(t + dur * 1.6 + .5); })); }
  function organ(a, d, f, t, dur, v){ [[1, 1], [2, .5], [3, .25], [4, .14]].forEach(([h, w]) => { const o = a.createOscillator(), g = a.createGain(); o.type = 'sine'; o.frequency.value = f * h;
    mEnv(g, t, .08, v * w, dur * .85, .15); o.connect(g); g.connect(d); o.start(t); o.stop(t + dur * 1.4 + .4); }); }
  function bell(a, d, f, t, v){ [[1, 1], [2.76, .4], [5.4, .16]].forEach(([m, w]) => { const o = a.createOscillator(), g = a.createGain(); o.type = 'sine'; o.frequency.value = f * m;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v * w, t + .005); g.gain.setTargetAtTime(0, t + .01, 1.2 / m); o.connect(g); g.connect(d); o.start(t); o.stop(t + 5); }); }
  function cello(a, d, f, t, dur, v){ const o = a.createOscillator(), o2 = a.createOscillator(), g = a.createGain(), lp = a.createBiquadFilter(), l = a.createOscillator(), lg = a.createGain();
    o.type = 'sawtooth'; o2.type = 'sawtooth'; o.frequency.value = f; o2.frequency.value = f * 1.003; l.frequency.value = 5; lg.gain.value = f * .005; l.connect(lg); lg.connect(o.frequency);
    lp.type = 'lowpass'; lp.frequency.value = f * 3.2; lp.Q.value = 1.2; o.connect(lp); o2.connect(lp); lp.connect(g); g.connect(d);
    mEnv(g, t, Math.min(.18, dur * .3), v, dur * .8, dur * .2); [o, o2, l].forEach(x => { x.start(t); x.stop(t + dur * 1.5 + .4); }); }
  function horn(a, d, f, t, dur, v){ const o = a.createOscillator(), o2 = a.createOscillator(), g = a.createGain(), lp = a.createBiquadFilter();
    o.type = 'sawtooth'; o2.type = 'sawtooth'; o.frequency.value = f; o2.frequency.value = f * 1.004; lp.type = 'lowpass'; lp.Q.value = 2;
    lp.frequency.setValueAtTime(f * 1.2, t); lp.frequency.linearRampToValueAtTime(f * 4.2, t + Math.min(.12, dur * .4)); lp.frequency.setTargetAtTime(f * 2.4, t + .15, dur * .4);
    o.connect(lp); o2.connect(lp); lp.connect(g); g.connect(d); mEnv(g, t, Math.min(.05, dur * .25), v, dur * .8, dur * .15); [o, o2].forEach(x => { x.start(t); x.stop(t + dur * 1.5 + .3); }); }
  function drum(a, d, t, v, f = 70){ const o = a.createOscillator(), g = a.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * .5, t + .25);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .004); g.gain.setTargetAtTime(0, t + .01, .14); o.connect(g); g.connect(d); o.start(t); o.stop(t + 1); }
  function snare(a, d, t, v){ const n = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); n.buffer = NOISE; f.type = 'bandpass'; f.frequency.value = 1700; f.Q.value = .8;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .002); g.gain.setTargetAtTime(0, t + .005, .07); n.connect(f); f.connect(g); g.connect(d); n.start(t, Math.random() * .5); n.stop(t + .4); }
  function wind(a, d, t, dur, v){ const n = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); n.buffer = NOISE; n.loop = true; f.type = 'bandpass'; f.Q.value = 2.5;
    f.frequency.setValueAtTime(300 + Math.random() * 200, t); f.frequency.linearRampToValueAtTime(700 + Math.random() * 400, t + dur * .5); f.frequency.linearRampToValueAtTime(280, t + dur);
    mEnv(g, t, dur * .4, v, dur * .4, dur * .2); n.connect(f); f.connect(g); g.connect(d); n.start(t); n.stop(t + dur * 1.3); }
  const melody = (a, d, m, t, sp, voice, v) => { if (!m) return; let at = 0; parse(m).forEach(([n, len]) => { voice(a, d, NOTE(n), t + at * sp, len * sp, v); at += len; }); };

  const SONGS = {
    // Morrowmere: a slow 3/4 lament in A minor. Organ drone, falling harp, a cello line on the second pass, a tolling bell
    hub: { vol:1, fade:3, beat:.3, steps:6, bars:['Am','F','C','G','Am','F','E','E','Dm','Am','F','E','Am','F','G','Am'], loop:0,
      mel:[null,null,null,null,null,null,null,null,'F4:2 E4:1 D4:3','C4:3 E4:3','A3:2 C4:1 D4:3','B3:6','C4:2 D4:1 E4:3','A4:3 G4:3','F4:2 E4:1 D4:3','A3:6'],
      bar(a, d, i, t, sp, pass){ const c = CH[this.bars[i]].map(NOTE);
        organ(a, d, c[0] / 2, t, sp * 6, .035); pad(a, d, c, t, sp * 6, .05);
        [c[2] * 2, c[1] * 2, c[0] * 2, c[2], c[1], c[0]].forEach((f, k) => harp(a, d, f, t + k * sp, k ? .07 : .11));
        if (i % 4 === 0) bell(a, d, c[0] * 2, t, .06);
        if (pass) melody(a, d, this.mel[i], t, sp, cello, .07); } },
    // The wilds (gathering): wind, a low drone and sparse harp. No drums
    wild: { vol:1, fade:3, beat:.36, steps:8, bars:['Em','Em','C','D','Em','Am','C','B'],
      bar(a, d, i, t, sp){ const c = CH[this.bars[i] === 'B' ? 'E' : this.bars[i]].map(NOTE);
        pad(a, d, [c[0] / 2, c[0], c[2]], t, sp * 8, .06, 450); wind(a, d, t + Math.random() * sp * 2, sp * 6, .05);
        [0, 3, 5].forEach(k => { if (Math.random() < .8) harp(a, d, c[Math.floor(Math.random() * 3)] * 2, t + k * sp, .06); });
        if (i % 4 === 2) bell(a, d, c[0] * 4, t + sp * 2, .025); } },
    // Fights: D minor at a driving gallop. Cello ostinato, war drums, horn melody second half
    fight: { vol:1.5, fade:.8, beat:.105, steps:16, bars:['Dm','Dm','Bb','C','Dm','Dm','Gm','A','Dm','Dm','Bb','C','Dm','Gm','A','A'],
      mel:[null,null,null,null,null,null,null,null,'D4:6 A3:2 D4:4 E4:4','F4:6 E4:2 D4:8','D4:4 F4:4 Bb4:6 A4:2','G4:8 E4:4 C4:4','A4:6 G4:2 F4:4 E4:4','D4:4 F4:4 G4:8','A4:4 G4:4 F4:4 E4:4','C#4:8 E4:8'],
      bar(a, d, i, t, sp){ const c = CH[this.bars[i]].map(NOTE), lo = c[0] / 2;
        [0, 3, 6, 8, 11, 14].forEach(k => cello(a, d, lo, t + k * sp, sp * 2, k % 8 ? .1 : .14));
        drum(a, d, t, .42, 70); drum(a, d, t + 6 * sp, .28, 78); drum(a, d, t + 8 * sp, .36, 70); if (i % 2) drum(a, d, t + 14 * sp, .24, 92);
        snare(a, d, t + 4 * sp, .13); snare(a, d, t + 12 * sp, .13); if (i % 8 === 7){ snare(a, d, t + 14 * sp, .08); snare(a, d, t + 15 * sp, .1); }
        pad(a, d, c, t, sp * 16, .05);
        if (i === 0 || i === 8) bell(a, d, NOTE('D5'), t, .06);
        melody(a, d, this.mel[i], t, sp, horn, .08); } },
    // Bosses: a heavy C-minor march. Organ, war drums on every beat, horn calls, a sour bell
    boss: { vol:1.6, fade:.8, beat:.12, steps:16, bars:['Cm','Cm','Ab','G','Cm','Cm','Fm','G','Cm','Ab','Fm','G','Cm','Ab','G','Cm'],
      mel:[null,null,null,null,null,null,null,null,'C4:6 Eb4:2 G4:8','Ab4:6 G4:2 Eb4:8','F4:4 Ab4:4 C5:8','B3:8 D4:4 G4:4','C4:4 G4:4 Eb5:8','D5:4 C5:4 Ab4:8','G4:4 F4:4 D4:4 B3:4','C4:16'],

  const chips = (xp ? [`<span class="rchip xp"><b>+${xp}</b><small>Combat XP</small></span>`] : []).concat(loot.map(([mat, n]) => `<span class="rchip">${iconImg({ kind:'mat', name:mat }, 'rico')}<b>${n}</b><small>${mat}</small></span>`));
  $('result').innerHTML = `<div class="rpanel ${won ? 'won' : 'lost'}"><img class="rstar" src="art/final/ui-star.webp" alt="">
    <div class="rkick">${won ? 'Victory' : 'Defeat'}</div><h2>${title}</h2>
    ${won ? `<div class="rsec"><div class="rlbl">Spoils</div><div class="rchips">${chips.join('') || '<span class="rnone">Nothing worth taking.</span>'}</div></div>` : `<p class="rsub">${sub}</p>`}
    ${lines.length ? `<div class="rnews">${lines.map(l => `<p>${l}</p>`).join('')}</div>` : ''}
    ${won ? `<div class="rsec"><div class="rlbl">Health</div><div class="rhp2"><div class="inkbar you"><i style="transform:scaleX(${(hp / mh).toFixed(3)})"></i></div><b>${hp}<small> / ${mh}</small></b></div>
      <p class="rhint">Your wounds carry into the next fight. Rest at the Inn to heal.${RUN.streak ? `<br><span>Win streak ${RUN.streak}</span> · the next fight gives +${Math.round((runMult() - 1) * 100)}% XP and spoils.` : ''}</p></div>` : ''}
    <div class="racts2">${won ? `<button class="fbtn" id="rLeave"><span>Return to camp</span></button>${canBoss ? `<button class="fbtn boss" id="rBoss"><span>Face ${ENEMIES[boss].name.replace('The ', '')}</span></button>` : ''}<button class="fbtn main" id="rOn"><span>Fight again</span></button>`
      : `<button class="fbtn main" id="rHome"><span>Wake in Morrowmere</span></button>`}</div></div>`;
  $('result').hidden = false;
  const close = () => { $('result').hidden = true; };
  if (won){
    $('rLeave').onclick = () => { close(); RUN.streak = 0; go('gather'); };
    $('rOn').onclick = () => { close(); go('fight', randomFoe(rg)); };
    if (canBoss) $('rBoss').onclick = () => { close(); go('fight', boss); };

}

/* ================= torn parchment + wax: every scrap gets its own edge ================= */
function seeded(str){ let h = 2166136261; for (const c of str) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return () => { h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909); return ((h >>>= 0) % 10000) / 10000; }; }
function tear(r, amp){
  amp *= .55 + r() * .9; const j = () => (r() * amp * (r() < .15 ? 2.2 : 1)).toFixed(2) + 'cqh', pts = [], n = 11 + Math.floor(r() * 12), m = 4 + Math.floor(r() * 5);
  for (let i = 0; i <= n; i++) pts.push(`${(i / n * 100).toFixed(1)}% ${j()}`);
  for (let i = 1; i < m; i++) pts.push(`calc(100% - ${j()}) ${(i / m * 100).toFixed(1)}%`);
  for (let i = n; i >= 0; i--) pts.push(`${(i / n * 100).toFixed(1)}% calc(100% - ${j()})`);
  for (let i = m - 1; i > 0; i--) pts.push(`${j()} ${(i / m * 100).toFixed(1)}%`);
  return `polygon(${pts.join(',')})`;
}
function blob(r){ const pts = []; for (let i = 0; i < 28; i++){ const a = i / 28 * Math.PI * 2, rad = 46 + r() * 4 + (i % 7 === 0 ? 2.5 : 0); pts.push(`${(50 + Math.cos(a) * rad).toFixed(1)}% ${(50 + Math.sin(a) * rad).toFixed(1)}%`); } return `polygon(${pts.join(',')})`; }
let tornSeed = 0;
function paperize(root){
  root.querySelectorAll('.paper:not([data-torn]), .seal:not([data-torn])').forEach(el => {
    const r = seeded((el.id || el.textContent || '') + (tornSeed++));
    el.dataset.torn = 1;
    if (el.classList.contains('seal')){ el.style.setProperty('--blob', blob(r)); el.style.setProperty('--rot', ((r() - .5) * 18).toFixed(1) + 'deg'); return; }
    const big = el.offsetHeight > 200 || el.id === 'craftPage' || el.closest('.journal');
    el.style.setProperty('--tear', tear(r, big ? 1.1 : .7));
    if (!el.closest('.journal') && el.id !== 'craftPage') el.style.setProperty('--rot', ((r() - .5) * (el.id === 'hud' ? 1.2 : 3)).toFixed(2) + 'deg');
  });
}
new MutationObserver(() => paperize(document.body)).observe(document.body, { childList:true, subtree:true });
